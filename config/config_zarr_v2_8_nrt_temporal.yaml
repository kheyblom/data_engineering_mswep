directories:
  download: /glade/derecho/scratch/kheyblom/data/mswep/
  logs: ./logs
output_conventions:
  filename: mswep.{version}.{period}.{temporal_resolution}.{grid_name}.{suffix}.zarr
  # sibling of the 'spatial' store built from the same files: same data, same
  # grid, chunked for the opposite access pattern
  suffix: temporal
# not shared with the spatial build, so one store's forensics stay readable
log_file: mswep_zarr_v2_8_nrt_temporal.log
# V2.8, spelled with two parts. format_version keeps however many parts the
# release carries, so this becomes 'v_2_8' on disk against V3.16's 'v_3_16'.
version: V2.8
# NRT, not Past. MSWEP publishes each release as two products that are NOT the
# same data, so they get separate stores rather than being merged.
product: NRT/Daily
variables: all
grid_name: native_0p1x0p1

# V2.8 NRT is complete over its span, 2020-11-27 to 2026-09-13: 2117 files on a
# 2117 step axis. Declared empty rather than omitted, because check_coverage
# compares against it either way -- an empty list asserts 'no gaps' rather than
# leaving the question unasked.
expected_missing_times: []

# NOT set for this store. The -239976.0 sentinel is a V3.16 Past defect; V2.8
# carries no negative values at all, in either product.

# one chunk holds a 2 x 2 degree tile through the whole record. The tile is the
# same 20 x 20 cells every store here uses, so a point time series is always the
# same tile and the stores are directly comparable -- but this record is only
# 2117 days, so the chunk is 3.2 MiB rather than the ~23 MiB of the Past store.
# That is a deliberate trade of chunk size for uniform tiling, not an oversight.
chunks:
  time: -1
  lat: 20
  lon: 20
# a store chunked across the whole time axis has no append boundary to stop at,
# so it is written as a skeleton and filled in place, one block per commit
write_strategy: region
# lat: 200 keeps the block a whole number of the 20 cell output chunks, which a
# region write requires, and matches the block used by every other store here.
# Alignment with the source chunking is mixed for this product, since it changes
# from [1, 32, 32] to [1, 200, 200] partway through the record: the later files
# align exactly, the earlier ones cannot, because 1800 / 32 = 56.25.
#
# lon: -1 because a block narrower than the globe reads a strided subset of the
# source chunks rather than contiguous runs. At 2117 timesteps a block is only
# 5.7 GiB resident, and there are 9 of them.
block_shape:
  lat: 200
  lon: -1
# timesteps pulled out of the lazy dataset per read. One MSWEP file is one
# timestep, so reading a block chunk by chunk would be one scheduler round trip
# per file; a year at a time is ~950 MiB of transient buffer.
timesteps_per_read: 365
# the region path reads serially behind one process-global HDF5 lock, so extra
# workers buy little; matched to the ncpus this build asks for
num_workers: 1
# a block reads every file of the record once, so nothing is re-read within a
# block and the cache only has to avoid thrashing rather than hold a working set
file_cache_maxsize: 64
# This product changes its source chunking partway through the record: the
# early files are [1, 32, 32] like V2.8 Past, the later ones [1, 200, 200] like
# V3.16. Correctness is unaffected -- dask chunks come from the explicit
# chunks= argument, not from the file -- but throughput varies across the
# record, and the cache has to be sized for the worse case. A [1, 32, 32] plane
# is 57 x 113 = 6441 chunks of 4 KiB = 25.8 MiB decompressed, so 64 MiB holds
# one with headroom. Costs file_cache_maxsize x this much memory in the worst
# case.
chunk_cache_size_mib: 64
# sized for the [1, 32, 32] files: HDF5 hashes chunks into this many slots, and
# the library default of 2003 is far below the 6441 chunks one of those planes
# touches, so the cache would evict chunks it is about to need. 8009 is the next
# convenient prime above 6441.
chunk_cache_slots: 8009

# Store global attributes. Every string is templated over the same config fields
# the filename template uses, so {version_label} and friends stay in one place.
# Coverage and grid attributes are not here: derive_attrs reads them off the
# data so they cannot drift from what was actually written.
#
# 'history', 'date_created' and 'verification' are deliberately absent: they
# describe a build and an audit that have not happened yet, and are written by
# finalize_mswep_zarr.py --attrs once they have. A store must not carry a claim
# it has not earned.
attrs:
  title: >-
    MSWEP {version_label} NEAR-REAL-TIME daily precipitation, native 0.1 degree
    global grid, 2020-2026
  summary: >-
    The near-real-time (NRT) stream of the Multi-Source Weighted-Ensemble
    Precipitation (MSWEP) {version_label} daily product, on its native 0.1
    degree global grid, stored as an icechunk-backed zarr store. A single
    variable, precipitation, merged from one netCDF file per day onto one
    time/lat/lon grid.
  # the single most important thing a consumer of this store needs to know
  product_caveat: >-
    THIS IS THE NEAR-REAL-TIME PRODUCT, NOT THE GAUGE-CORRECTED ONE. MSWEP NRT
    is produced with low latency and is not the same estimate as the Past
    (reanalysis) product, which applies gauge correction. Where the sibling Past
    store covers the same day -- the 34 day overlap 2020-11-27 to 2020-12-30 --
    PREFER THE PAST STORE. Measured across that overlap the two products
    correlate 0.94-0.96 with an RMSE of about 1.9 mm/day and a bias under
    0.1 mm/day, and only ~15 per cent of cells are identical; the difference is
    small in the mean but not negligible cell by cell. Note that this store
    covers 2021 onward with NRT data only, since V2.8 Past ends at 2020-12-30;
    for those years the newer V3.16 Past product is gauge-corrected through
    2025-06-29 and is the better choice where it reaches.
  # ACDD rather than CF, deliberately: see cf_compliance
  Conventions: ACDD-1.3
  cf_compliance: >-
    Not CF compliant. The variable's units are carried through unaltered from
    the upstream MSWEP netCDF files, spelled 'mm/d', which udunits does not
    parse; the upstream files carry no standard_name and no long_name at all.
    Note this product spells the units differently from the Past product of the
    same release, which uses 'mm d-1'. Correcting them would mean diverging from
    upstream, so they are left as published and the descriptive names are
    supplied through variable_attrs instead.
  source: >-
    MSWEP {version_label} {period} {temporal_resolution} netCDF files, one file
    per day, downloaded from the GloH2O Google Drive distribution by
    access_mswep
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  references: >-
    http://www.gloh2o.org/mswep/ -- Beck et al. (2019), MSWEP V2 global
    3-hourly 0.1 degree precipitation, Bulletin of the American Meteorological
    Society 100(3), doi:10.1175/BAMS-D-17-0138.1
  chunking: >-
    Chunked (time, lat, lon) = (2117, 20, 20), float32, zstd: one 2 x 2 degree
    tile through the whole record per chunk, 3.2 MiB. Built for reading time
    series -- a series at any point is a single chunk. The chunk is small by
    zarr standards because the record is short; the 20 x 20 tile is held
    constant across every store in this collection so that a point series is
    always the same tile. A global map is the worst case for this layout,
    touching all 16200 chunks of the variable; for maps and fields read the
    sibling mswep.{version}.{period}.{temporal_resolution}.{grid_name}.spatial.zarr
    instead, which holds the same data chunked (1, 1800, 3600).
  related_store: >-
    Three siblings hold the same variable on the same grid. Same product, other
    layout: mswep.{version}.nrt.{temporal_resolution}.{grid_name}.spatial.zarr,
    chunked one whole global map per chunk. The gauge-corrected
    Past product, which should be preferred wherever it overlaps this one:
    mswep.{version}.past.{temporal_resolution}.{grid_name}.spatial.zarr and
    mswep.{version}.past.{temporal_resolution}.{grid_name}.temporal.zarr, which
    cover 1979-01-02 to 2020-12-30. Every store is built from and verified
    against the raw files independently rather than derived from another.
  source_chunking_note: >-
    The upstream files change their internal chunking partway through this
    record: the early ones are chunked [1, 32, 32] and the later ones
    [1, 200, 200]. This affects only how fast the record reads, not what it
    contains; the store's own chunking is uniform.
  known_data_gaps: >-
    None. This store's 2117 day axis is complete and regularly spaced: every day
    from 2020-11-27 to 2026-09-13 is present and was written from its own raw
    file. Unlike the V3.16 Past store, this release publishes no undeclared fill
    sentinel, so nothing was masked and every chunk of the array was written.

# Attributes to put on the data variables themselves. MSWEP's files carry only
# 'units' and 'least_significant_digit', with no long_name and no standard_name,
# so unlike GLEAM there is a real gap here rather than upstream metadata to
# preserve. Anything set here goes on top of what the files carry; 'units' is
# deliberately not overridden, so the upstream spelling survives.
variable_attrs:
  precipitation:
    long_name: Precipitation
    # a genuine CF standard name, unlike the units; the quantity is a flux even
    # though it is published in mm/d rather than the canonical kg m-2 s-1
    standard_name: precipitation_flux
    comment: >-
      Daily total precipitation from the MSWEP near-real-time stream, NOT
      gauge-corrected -- see the store's product_caveat attribute. Values are
      quantised upstream; see the least_significant_digit attribute carried over
      from the source files, so not all of the float32 precision is meaningful.
